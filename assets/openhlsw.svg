  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#0b0e12" stroke-width="4"/>
  <rect x="14" y="14" width="228" height="114" rx="46" fill="#ffffff" opacity="0.05"/>
