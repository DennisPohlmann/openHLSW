    <radialGradient id="sweep" cx="128" cy="128" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0.55"/>
