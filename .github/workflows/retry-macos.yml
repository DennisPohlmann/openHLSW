name: retry macos

# Re-runs a build run whose only problem is that the macOS job never got a runner. Real build
# failures stay red. Three attempts at most (build.yml takes the Intel pool from the second on).
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # A run cancelled by hand concludes "cancelled", a job without a runner "failure".
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - run: |
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq '
            [.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")]
            | if length == 1 and .[0].name == "macos universal" and .[0].conclusion == "cancelled"
                and (.[0].runner_name // "") == ""
              then "retry" else "keep" end')
          echo "$verdict"
          if [ "$verdict" = retry ]; then
            gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
          fi
