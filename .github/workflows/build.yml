# Builds and packages openHLSW when a version tag "v*" is pushed
# (git tag v0.1.0 && git push --tags) and publishes a GitHub release with all packages:
#   Linux   x86_64, aarch64: .tar.gz, .deb, .rpm, .flatpak
#   Linux   riscv64:         .tar.gz, .deb, .rpm
#   Windows x64, x86, arm64: .msi, -portable.zip
#   macOS   universal:       .dmg, .zip (Apple silicon + Intel)
#   FreeBSD x86_64:          .tar.gz
name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy + tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: linux ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # cross builds in containers with an old glibc, so the binaries run on older distros too.
      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package .tar.gz
        shell: bash
        run: |
          set -euo pipefail
          name="openhlsw-v${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/openhlsw \
             target/${{ matrix.target }}/release/openhlsw-cli \
             README.md CHANGELOG.md LICENSE \
             packaging/linux/openhlsw.desktop packaging/linux/openhlsw.png \
             "dist/$name/"
          cp assets/games/NOTICE.txt "dist/$name/GAME-ICONS-NOTICE.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Package .deb
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/

      - name: Package .rpm
        run: cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - run: ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: openhlsw-linux-${{ matrix.arch }}
          path: dist/*

  flatpak:
    name: flatpak ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openhlsw-linux-${{ matrix.arch }}
          path: linux

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # The Flatpak packs the binaries of the Linux build (cross, old glibc).
      - name: Flatpak sources
        shell: bash
        run: |
          set -euo pipefail
          dir=build/flatpak
          mkdir -p "$dir"
          mkdir -p build/bin
          tar -xzf linux/openhlsw-v${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz \
              -C build/bin --strip-components=1
          cp build/bin/openhlsw build/bin/openhlsw-cli "$dir/"
          cp packaging/linux/openhlsw.desktop packaging/linux/openhlsw.png LICENSE "$dir/"
          cp packaging/linux/flatpak/* "$dir/"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build/flatpak/io.github.openhlsw.openHLSW.yml
          bundle: openhlsw-v${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false

      - name: Collect
        shell: bash
        run: mkdir -p dist && mv openhlsw-*.flatpak dist/ && ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: openhlsw-flatpak-${{ matrix.arch }}
          path: dist/*

  windows:
    name: windows ${{ matrix.arch }}
    needs: check
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            wix_arch: x64
          - arch: x86
            target: i686-pc-windows-msvc
            wix_arch: x86
          - arch: arm64
            target: aarch64-pc-windows-msvc
            wix_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package -portable.zip
        shell: pwsh
        run: |
          $name = "openhlsw-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-portable"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\${{ matrix.target }}\release\openhlsw.exe, target\${{ matrix.target }}\release\openhlsw-cli.exe, README.md, CHANGELOG.md, LICENSE -Destination $dir
          Copy-Item assets\games\NOTICE.txt "$dir\GAME-ICONS-NOTICE.txt"
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse -Force $dir

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: License page for the installer (LICENSE as .rtf)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $text = Get-Content LICENSE -Raw
          $text = $text -replace '\\', '\\' -replace '\{', '\{' -replace '\}', '\}'
          $text = $text -replace "`r?`n", "\par`r`n"
          "{\rtf1\ansi\deff0{\fonttbl{\f0 Tahoma;}}\fs16`r`n$text}" |
            Set-Content -Encoding ascii build\License.rtf

      - name: Package .msi
        shell: pwsh
        run: |
          $name = "openhlsw-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}"
          # Icon with bitmap entries, written by build.rs (the one embedded in the .exe).
          $icon = Get-ChildItem "target\${{ matrix.target }}\release\build\openhlsw-*\out\openhlsw.ico" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $icon) { $icon = Get-Item assets\openhlsw.ico }
          wix build -arch ${{ matrix.wix_arch }} `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d Version=${{ steps.version.outputs.version }} `
            -d RepoDir="$PWD" `
            -d BinDir="$PWD\target\${{ matrix.target }}\release" `
            -d LicenseRtf="$PWD\build\License.rtf" `
            -d IconFile="$($icon.FullName)" `
            packaging\windows\openhlsw.wxs -o "dist\$name.msi"
          Remove-Item -Force -ErrorAction SilentlyContinue "dist\$name.wixpdb"

      - run: Get-ChildItem dist
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: openhlsw-windows-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macos universal
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build (Apple silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/universal
          for b in openhlsw openhlsw-cli; do
            lipo -create -output "build/universal/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          lipo -info build/universal/openhlsw

      - name: App bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bin=build/universal
          app=build/openHLSW.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin/openhlsw" "$bin/openhlsw-cli" "$app/Contents/MacOS/"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Icon: .icns from the 256 px PNG.
          mkdir -p build/openhlsw.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s packaging/linux/openhlsw.png --out "build/openhlsw.iconset/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 64 128; do
            cp "build/openhlsw.iconset/icon_$((s * 2))x$((s * 2)).png" "build/openhlsw.iconset/icon_${s}x${s}@2x.png"
          done
          rm build/openhlsw.iconset/icon_64x64.png build/openhlsw.iconset/icon_64x64@2x.png
          iconutil -c icns build/openhlsw.iconset -o "$app/Contents/Resources/openhlsw.icns"
          # Ad-hoc signature (Apple silicon only runs signed code; not notarized).
          codesign --force --deep --sign - "$app"

      - name: Package .zip and .dmg
        shell: bash
        run: |
          set -euo pipefail
          name="openhlsw-v${{ steps.version.outputs.version }}-macos-universal"
          mkdir -p dist "build/$name"
          cp -R build/openHLSW.app README.md CHANGELOG.md LICENSE "build/$name/"
          cp assets/games/NOTICE.txt "build/$name/GAME-ICONS-NOTICE.txt"
          # ditto keeps the app bundle intact (permissions, signature).
          ditto -c -k --keepParent "build/$name" "dist/$name.zip"
          # Disk image with the app and a link to /Applications for drag & drop install.
          ln -s /Applications "build/$name/Applications"
          hdiutil create -volname "openHLSW" -srcfolder "build/$name" -ov -format UDZO "dist/$name.dmg"

      - run: ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: openhlsw-macos-universal
          path: dist/*

  freebsd:
    name: freebsd x86_64
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Native build in a FreeBSD VM (Rust from rustup, X11 / Wayland / GL are loaded at runtime).
      - name: Build and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          release: "15"
          envs: VERSION
          usesh: true
          prepare: |
            pkg install -y curl pkgconf libX11 libxkbcommon
          run: |
            set -eu
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release
            name="openhlsw-v${VERSION}-freebsd-x86_64"
            mkdir -p "dist/$name"
            cp target/release/openhlsw target/release/openhlsw-cli \
               README.md CHANGELOG.md LICENSE \
               packaging/linux/openhlsw.desktop packaging/linux/openhlsw.png \
               "dist/$name/"
            cp assets/games/NOTICE.txt "dist/$name/GAME-ICONS-NOTICE.txt"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"

      - run: ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: openhlsw-freebsd-x86_64
          path: dist/*.tar.gz

  release:
    name: GitHub release
    needs: [linux, flatpak, windows, macos, freebsd]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Release notes (only this version's CHANGELOG.md section)
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v head="## [${tag}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "openHLSW ${tag}" > release-notes.md
          fi
          printf '\nFull history: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "${GITHUB_REPOSITORY}" "${tag}" >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: false
